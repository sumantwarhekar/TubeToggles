<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeToggles</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="dark-mode">
  <div id="app-container">
    <div class="header">
      <div class="logo">
        <div class="logo-icon"></div>
        <h1>TubeToggles</h1>
        <label class="switch master-switch">
          <input type="checkbox" id="extensionEnabled">
          <span class="slider round"></span>
        </label>
      </div>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle Theme">
        <!-- Sun Icon (shown in dark mode, to switch to light) -->
        <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon (shown in light mode, to switch to dark) -->
        <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <div class="content">
      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-title">Stable Volume</span>
          <span class="toggle-desc">Balance loud and quiet sounds</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="stableVolume">
          <span class="slider round"></span>
        </label>
      </div>

      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-title">Voice Boost</span>
          <span class="toggle-desc">Enhance speech clarity</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="voiceBoost">
          <span class="slider round"></span>
        </label>
      </div>

      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-title">Ambient Mode</span>
          <span class="toggle-desc">Cinematic lighting effect</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="ambientMode">
          <span class="slider round"></span>
        </label>
      </div>

      <div class="toggle-row">
        <div class="toggle-info">
          <span class="toggle-title">Annotations</span>
          <span class="toggle-desc">End screens and info cards</span>
        </div>
        <label class="switch">
          <input type="checkbox" id="annotations">
          <span class="slider round"></span>
        </label>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
