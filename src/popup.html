<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeToggles</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="logo-icon" aria-hidden="true"></div>
      <h1>TubeToggles</h1>
    </div>
    <div class="header-actions">
      <!-- Cycles the popup's theme: match YouTube, light, dark -->
      <button type="button" id="themeButton" class="icon-btn" data-mode="auto">
        <svg class="icon-auto" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"></path>
        </svg>
        <svg class="icon-light" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.5"></circle>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
        </svg>
        <svg class="icon-dark" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <path d="M20.5 14.1A8.5 8.5 0 1 1 9.9 3.5a6.6 6.6 0 0 0 10.6 10.6z"></path>
        </svg>
      </button>
      <label class="switch" title="Turn TubeToggles on or off">
        <input type="checkbox" role="switch" id="extensionEnabled" aria-label="TubeToggles on">
        <span class="track"></span>
      </label>
    </div>
  </header>

  <p class="status" id="status" role="status">
    <span class="status-dot" aria-hidden="true"></span>
    <span id="statusText"></span>
  </p>

  <!-- Sections and rows are built from settings.js -->
  <main id="settings"></main>

  <p class="note">Changes in the player are saved here too.</p>

  <footer class="footer">
    <span id="version"></span>
    <span aria-hidden="true">·</span>
    <a href="https://chromewebstore.google.com/detail/tubetoggles/kganjailpdkhfgaflnnjpjjldplnalcc/reviews" target="_blank" rel="noopener">★ Rate</a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/sumantwarhekar/TubeToggles/issues" target="_blank" rel="noopener">Report a problem</a>
    <span aria-hidden="true">·</span>
    <button type="button" id="reset" class="link-button">Reset</button>
  </footer>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
