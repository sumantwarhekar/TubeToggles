<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeToggles</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="logo-icon" aria-hidden="true"></div>
      <h1>TubeToggles</h1>
    </div>
    <label class="switch" title="Turn TubeToggles on or off">
      <input type="checkbox" role="switch" id="extensionEnabled" aria-label="TubeToggles on">
      <span class="track"></span>
    </label>
  </header>

  <p class="status" id="status" role="status">
    <span class="status-dot" aria-hidden="true"></span>
    <span id="statusText"></span>
  </p>

  <!-- Sections and rows are built from settings.js -->
  <main id="settings"></main>

  <p class="note">Changes in the player are saved here too.</p>

  <footer class="footer">
    <span id="version"></span>
    <span aria-hidden="true">·</span>
    <a href="https://chromewebstore.google.com/detail/tubetoggles/kganjailpdkhfgaflnnjpjjldplnalcc/reviews" target="_blank" rel="noopener">★ Rate</a>
    <span aria-hidden="true">·</span>
    <a href="https://github.com/sumantwarhekar/TubeToggles/issues" target="_blank" rel="noopener">Report a problem</a>
    <span aria-hidden="true">·</span>
    <button type="button" id="reset" class="link-button">Reset</button>
  </footer>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
