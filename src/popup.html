<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeToggles</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="dark-mode">
  <div id="app-container">
    <div class="header">
      <div class="logo">
        <div class="logo-icon"></div>
        <h1>TubeToggles</h1>
        <label class="switch master-switch" title="Turn TubeToggles on or off">
          <input type="checkbox" id="extensionEnabled" aria-label="TubeToggles on">
          <span class="slider round"></span>
        </label>
      </div>
      <button id="themeToggle" class="icon-btn" aria-label="Toggle Theme">
        <!-- Sun Icon (shown in dark mode, to switch to light) -->
        <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <!-- Moon Icon (shown in light mode, to switch to dark) -->
        <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>

    <!-- One row per setting, built from settings.js -->
    <div class="content" id="settings"></div>

    <p class="footnote">Changes you make in YouTube's player are saved here too.</p>
  </div>

  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
